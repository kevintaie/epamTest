<header class="app-header">
  <div class="header-content">
    <h1 class="logo" (click)="goHome()">SkyRoute</h1>
    <span class="tagline">Find your perfect flight</span>
  </div>
</header>

<main class="app-main">
  @if (showResultsLayout) {
    <div class="results-layout">
      <aside class="sidebar">
        <app-flight-search [compact]="true"></app-flight-search>
      </aside>
      <div class="results-content">
        <app-flight-results></app-flight-results>
      </div>
    </div>
  } @else {
    <app-flight-search></app-flight-search>
  }
</main>

@if (selectedFlight$ | async) {
  <div class="drawer-backdrop" (click)="closeDrawer()"></div>
  <aside class="drawer">
    <button class="drawer-close" (click)="closeDrawer()" aria-label="Close">&#x2715;</button>
    <app-flight-booking></app-flight-booking>
  </aside>
}
